<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz 3D - Página 2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene">
      <section class="quiz-card">
        <header class="header">
          <span class="badge">Página 2 de 5</span>
          <h1>Quiz de Desenvolvimento Web</h1>
        </header>

        <form id="quiz-form" class="quiz-body" data-page="2">
          <div class="question">
            <p>3. Qual seletor CSS representa um elemento com o ID "titulo"?</p>
            <label class="option">
              <input type="radio" name="q3" value="A" />
              <span>#titulo</span>
            </label>
            <label class="option">
              <input type="radio" name="q3" value="B" />
              <span>.titulo</span>
            </label>
            <label class="option">
              <input type="radio" name="q3" value="C" />
              <span>titulo</span>
            </label>
            <label class="option">
              <input type="radio" name="q3" value="D" />
              <span>*titulo</span>
            </label>
          </div>

          <div class="question">
            <p>4. Em JavaScript, qual instrução é usada para exibir uma mensagem em uma caixa de diálogo?</p>
            <label class="option">
              <input type="radio" name="q4" value="A" />
              <span>console.log()</span>
            </label>
            <label class="option">
              <input type="radio" name="q4" value="B" />
              <span>alert()</span>
            </label>
            <label class="option">
              <input type="radio" name="q4" value="C" />
              <span>confirm()</span>
            </label>
            <label class="option">
              <input type="radio" name="q4" value="D" />
              <span>prompt()</span>
            </label>
          </div>

          <div class="actions">
            <button type="button" class="secondary-btn" id="prev-btn">Anterior</button>
            <button type="button" class="primary-btn" id="next-btn">Próxima página</button>
          </div>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
