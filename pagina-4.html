<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz 3D - Página 4</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene">
      <section class="quiz-card">
        <header class="header">
          <span class="badge">Página 4 de 5</span>
          <h1>Quiz de Desenvolvimento Web</h1>
        </header>

        <form id="quiz-form" class="quiz-body" data-page="4">
          <div class="question">
            <p>7. Qual método JavaScript adiciona um elemento ao final de um array?</p>
            <label class="option">
              <input type="radio" name="q7" value="A" />
              <span>shift()</span>
            </label>
            <label class="option">
              <input type="radio" name="q7" value="B" />
              <span>push()</span>
            </label>
            <label class="option">
              <input type="radio" name="q7" value="C" />
              <span>pop()</span>
            </label>
            <label class="option">
              <input type="radio" name="q7" value="D" />
              <span>unshift()</span>
            </label>
          </div>

          <div class="question">
            <p>8. Qual atributo HTML define um campo de entrada para telefone?</p>
            <label class="option">
              <input type="radio" name="q8" value="A" />
              <span>type="number"</span>
            </label>
            <label class="option">
              <input type="radio" name="q8" value="B" />
              <span>type="text"</span>
            </label>
            <label class="option">
              <input type="radio" name="q8" value="C" />
              <span>type="email"</span>
            </label>
            <label class="option">
              <input type="radio" name="q8" value="D" />
              <span>type="tel"</span>
            </label>
          </div>

          <div class="actions">
            <button type="button" class="secondary-btn" id="prev-btn">Anterior</button>
            <button type="button" class="primary-btn" id="next-btn">Próxima página</button>
          </div>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
